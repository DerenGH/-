<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+Armenian:wght@400;700&display=swap');

/* Reset and Global Layout */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  background-color: #1a1a2e; /* Ensures the browser background matches the quiz */
}

#quiz-root {
  min-height: 100vh; /* Forces container to fill the entire window height */
  width: 100%;
  font-family: 'Nunito', sans-serif;
  background: #1a1a2e;
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow-x: hidden;
  padding: 40px 20px;
}

.bg-dots {
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
  background-size: 28px 28px;
  pointer-events: none;
}

/* Screen and UI elements */
.screen {
  width: 100%;
  max-width: 600px;
  position: relative;
  z-index: 1;
}

.screen.hidden { display: none; }

#screen-main { text-align: center; }

.quiz-badge {
  display: inline-block;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 100px;
  padding: 6px 18px;
  font-size: 13px;
  letter-spacing: 0.08em;
  margin-bottom: 20px;
  color: #c8b8ff;
}

.quiz-main-title {
  font-family: 'Noto Sans Armenian', 'Nunito', sans-serif;
  font-size: clamp(32px, 8vw, 42px); /* Responsive title size */
  font-weight: 900;
  line-height: 1.15;
  margin-bottom: 10px;
  background: linear-gradient(135deg, #fff 0%, #c8b8ff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.quiz-sub {
  color: rgba(255, 255, 255, 0.55);
  font-size: 15px;
  margin-bottom: 40px;
}

.btn-start {
  background: linear-gradient(135deg, #7c3aed, #a855f7);
  border: none;
  border-radius: 100px;
  color: #fff;
  font-family: 'Nunito', sans-serif;
  font-size: 20px;
  font-weight: 800;
  padding: 16px 56px;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 8px 32px rgba(124, 58, 237, 0.45);
}

.btn-start:hover { transform: scale(1.05); }

.progress-bar-wrap {
  width: 100%;
  height: 7px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 100px;
  margin-bottom: 16px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #7c3aed, #a855f7);
  border-radius: 100px;
  transition: width 0.4s ease;
}

.timer-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  min-height: 26px;
}

.timer-num {
  font-size: 15px;
  font-weight: 800;
  min-width: 28px;
  text-align: right;
  transition: color 0.3s;
}

.timer-track {
  flex: 1;
  height: 10px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 100px;
  overflow: hidden;
}

.timer-fill {
  height: 100%;
  border-radius: 100px;
  width: 100%;
  transition: width 1s linear, background-color 0.5s;
  background: #a855f7;
}

.timer-hidden { visibility: hidden; }

.q-counter {
  text-align: center;
  font-size: 13px;
  color: rgba(255, 255, 255, 0.45);
  margin-bottom: 10px;
  letter-spacing: 0.05em;
}

.q-text {
  font-family: 'Noto Sans Armenian', 'Nunito', sans-serif;
  text-align: center;
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 22px;
  line-height: 1.5;
  color: #fff;
}

.q-abbr {
  color: #f0c040;
  font-size: 24px;
  display: block;
  margin-top: 8px;
  font-family: 'Nunito', sans-serif;
}

.answers-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

@media (max-width: 480px) {
  .answers-grid { grid-template-columns: 1fr; }
}

.ans-btn {
  background: rgba(255, 255, 255, 0.07);
  border: 2px solid rgba(255, 255, 255, 0.12);
  border-radius: 14px;
  color: #fff;
  font-family: 'Noto Sans Armenian', 'Nunito', sans-serif;
  font-size: 14px;
  font-weight: 700;
  padding: 14px 10px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, transform 0.12s;
  text-align: center;
  min-height: 72px;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
}

.ans-btn:hover:not(:disabled) {
  background: rgba(255, 255, 255, 0.14);
  border-color: rgba(255, 255, 255, 0.3);
  transform: scale(1.02);
}

.ans-btn.correct { background: rgba(34, 197, 94, 0.3); border-color: #22c55e; color: #86efac; }
.ans-btn.wrong { background: rgba(239, 68, 68, 0.3); border-color: #ef4444; color: #fca5a5; }

/* Match and Result specific styles ... */
.freetext-input {
  background: rgba(255, 255, 255, 0.07);
  border: 2px solid rgba(255, 255, 255, 0.2);
  border-radius: 14px;
  color: #fff;
  font-family: 'Noto Sans Armenian', sans-serif;
  font-size: 16px;
  padding: 16px;
  width: 100%;
  margin-bottom: 10px;
}

.freetext-submit {
  background: linear-gradient(135deg, #7c3aed, #a855f7);
  border: none;
  border-radius: 100px;
  color: #fff;
  padding: 12px 30px;
  cursor: pointer;
  font-weight: 800;
}

.result-title { font-family: 'Noto Sans Armenian', sans-serif; font-size: 30px; margin-bottom: 10px; }
.btn-restart {
  background: linear-gradient(135deg, #7c3aed, #a855f7);
  border: none;
  border-radius: 100px;
  color: #fff;
  padding: 14px 40px;
  cursor: pointer;
  font-weight: 800;
  margin-top: 20px;
}
.flash-overlay{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 0.15s;z-index:10;}
.flash-overlay.green{background:rgba(34,197,94,0.13);}
.flash-overlay.red{background:rgba(239,68,68,0.13);}
.flash-overlay.active{opacity:1;}
</style>

<div id="quiz-root">
  <div class="bg-dots"></div>
  <div class="flash-overlay" id="flash-overlay"></div>

  <div id="screen-main" class="screen">
    <div class="quiz-badge">12 Հարց · Ժամաչափ</div>
    <div class="quiz-main-title">Հապավումների<br>Քվիզ</div>
    <div class="quiz-sub">Abbreviations Quiz — Որքա՞ն լավ գիտեք դրանք:</div>
    <button class="btn-start" onclick="startQuiz()">Սկսել</button>
  </div>

  <div id="screen-quiz" class="screen hidden">
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="prog-fill" style="width:0%"></div></div>
    <div class="timer-row" id="timer-row">
      <span class="timer-num" id="timer-num">15</span>
      <div class="timer-track"><div class="timer-fill" id="timer-fill"></div></div>
    </div>
    <div class="q-counter" id="q-counter"></div>
    <div class="q-text" id="q-text"></div>
    <div id="q-body"></div>
  </div>

  <div id="screen-result" class="screen hidden">
    <div class="result-title">Արդյունք / Result</div>
    <div class="result-sub">Ահա թե ինչպես դուք անցաք թեստը:</div>
    <div style="text-align:center; margin-bottom: 20px;">
        <canvas id="donut-canvas" width="180" height="180"></canvas>
        <div style="margin-top:-100px; font-size:32px; font-weight:900;" id="donut-pct">0%</div>
        <div style="margin-top:40px; color:rgba(255,255,255,0.5)">Ճշտություն</div>
    </div>
    <div class="score-detail" id="score-detail" style="margin-top:30px;"></div>
    <button class="btn-restart" onclick="restartQuiz()">Կրկին փորձել / Try Again</button>
  </div>
</div>

<script>
// Logic and pairs from armenian_abbreviation_quiz_final.html
const MATCH_PAIRS_1=[
  {abbr:'EU',  arm:'ԵՄ'},
  {abbr:'CoE', arm:'ԵԽ'},
  {abbr:'UN',  arm:'ՄԱԿ'},
  {abbr:'NA',  arm:'ԱԺ'},
  {abbr:'SC',  arm:'ԱԽ'},
  {abbr:'MB',  arm:'ՄԲ'},
];

const MATCH_PAIRS_2=[
  {abbr:'OS',  arm:'ՕՀ'},
  {abbr:'CPU', arm:'ԿՊՀ'},
  {abbr:'WWW', arm:'ՀՀՀ'},
  {abbr:'IT',  arm:'ՏՏ'},
  {abbr:'MFA', arm:'ԱԳՆ'},
  {abbr:'CIS', arm:'ԱՊՀ'},
];

const QUESTIONS=[
  {
    type:'mcq', timed:true,
    qText:'Ի՞նչ է հապավումը: / What is an abbreviation?',
    answers:[
      'Բառի ամբողջական ձևը / Full form of a word',
      'Բառի կամ արտահայտության կրճատված ձևը / Shortened form',
      'Նոր բառ / A new word',
      "Չգիտեմ / I don't know"
    ],
    correct:'Բառի կամ արտահայտության կրճատված ձևը / Shortened form'
  },
  {
    type:'mcq', timed:true,
    qText:'Ի՞նչ է նշանակում «BFF»-ը: / What does "BFF" stand for?',
    answers:[
      'Լավագույն ընկերներ հավերժ / Best Friends Forever',
      'Արագ ընկերացիր / Be Friends Fast',
      'Մեծ ընկերասեր տղա / Big Friendly Fellow',
      'Ուրբաթ օրվա լավագույն զվարճանքը / Best Friday Fun'
    ],
    correct:'Լավագույն ընկերներ հավերժ / Best Friends Forever'
  },
  {
    type:'freetext', timed:false,
    qText:'Ի՞նչ հապավումներ գիտեք: / What abbreviations do you know?'
  },
  {
    type:'mcq', timed:true,
    qText:'Որտե՞ղ ենք ամենաշատը հանդիպում հապավումների: / Where do we encounter abbreviations the most?',
    answers:[
      'Բժշկության մեջ / Medicine',
      'Դասագրքերում / Textbooks',
      'Սոցիալական ցանցերում / Social media',
      'Ֆիլմերում և սերիալներում / Movies & TV shows'
    ],
    correct:'Սոցիալական ցանցերում / Social media'
  },
  {
    type:'mcq-open', timed:true,
    qText:'Ո՞ր հապավումն է ճիշտ: / Which is the correct abbreviation?',
    fullForm:'Personal Computer',
    answers:['OS','CPU','CT','PC'], correct:'PC'
  },
  {
    type:'mcq-open', timed:true,
    qText:'Ո՞ր հապավումն է ճիշտ: / Which is the correct abbreviation?',
    fullForm:'Blood Pressure',
    answers:['HR','RR','ER','BP'], correct:'BP'
  },
  {
    type:'mcq-open', timed:true,
    qText:'Ո՞ր հապավումն է ճիշտ: / Which is the correct abbreviation?',
    fullForm:'North Atlantic Treaty Organization',
    answers:['NASA','NGO','NGL','NATO'], correct:'NATO'
  },
  {
    type:'mcq-open', timed:true,
    qText:'Ո՞ր հապավումն է ճիշտ: / Which is the correct abbreviation?',
    fullForm:'United Nations',
    answers:['EU','NA','MP','UN'], correct:'UN'
  },
  {
    type:'mcq-abbr', timed:true,
    qText:'Ո՞ր հապավումն է սա: / What is the abbreviation for?',
    fullForm:'Council of Europe',
    answers:['CIS','CEC','CPU','CoE'], correct:'CoE'
  },
  {
    type:'mcq-abbr', timed:true,
    qText:'Ո՞ր հապավումն է սա: / What is the abbreviation for?',
    fullForm:'Megabyte',
    answers:['GB','MP','NA','MB'], correct:'MB'
  }
];

let current=0, score=0, timerInterval=null;

function startQuiz() {
  current=0; score=0;
  document.getElementById('screen-main').classList.add('hidden');
  document.getElementById('screen-quiz').classList.remove('hidden');
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[current];
  document.getElementById('q-counter').textContent = (current+1) + " / " + QUESTIONS.length;
  document.getElementById('prog-fill').style.width = ((current / QUESTIONS.length) * 100) + "%";
  document.getElementById('q-text').innerHTML = q.qText + (q.fullForm ? `<span class="q-abbr">${q.fullForm}</span>` : "");
  
  const body = document.getElementById('q-body');
  body.innerHTML = "";

  if(q.type === 'mcq' || q.type === 'mcq-open' || q.type === 'mcq-abbr') {
    const grid = document.createElement('div');
    grid.className = 'answers-grid';
    q.answers.forEach(ans => {
      const btn = document.createElement('button');
      btn.className = 'ans-btn';
      btn.textContent = ans;
      btn.onclick = () => checkAnswer(ans, q.correct, btn);
      grid.appendChild(btn);
    });
    body.appendChild(grid);
    if(q.timed) startTimer(15);
  } else if(q.type === 'freetext') {
    const input = document.createElement('input');
    input.className = 'freetext-input';
    input.placeholder = "Մուտքագրեք այստեղ...";
    const btn = document.createElement('button');
    btn.className = 'freetext-submit';
    btn.textContent = "Հաջորդը";
    btn.onclick = () => { score++; advance(); };
    body.appendChild(input);
    body.appendChild(btn);
  }
}

function startTimer(sec) {
  let left = sec;
  const fill = document.getElementById('timer-fill');
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    left--;
    document.getElementById('timer-num').textContent = left;
    fill.style.width = (left/sec*100) + "%";
    if(left <= 0) { clearInterval(timerInterval); advance(); }
  }, 1000);
}

function checkAnswer(chosen, correct, btn) {
  clearInterval(timerInterval);
  if(chosen === correct) {
    btn.classList.add('correct');
    score++;
    flash('green');
  } else {
    btn.classList.add('wrong');
    flash('red');
  }
  setTimeout(advance, 1000);
}

function flash(type) {
  const f = document.getElementById('flash-overlay');
  f.className = 'flash-overlay ' + type + ' active';
  setTimeout(() => f.classList.remove('active'), 300);
}

function advance() {
  current++;
  if(current < QUESTIONS.length) renderQuestion();
  else showResult();
}

function showResult() {
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-result').classList.remove('hidden');
  const pct = Math.round((score/QUESTIONS.length)*100);
  document.getElementById('donut-pct').textContent = pct + "%";
  document.getElementById('score-detail').innerHTML = `Դուք ճիշտ պատասխանեցիք <b>${score} / ${QUESTIONS.length}</b> հարցի:`;
  drawDonut(pct);
}

function drawDonut(pct) {
  const canvas = document.getElementById('donut-canvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,180,180);
  ctx.beginPath(); ctx.arc(90,90,70,0,2*Math.PI);
  ctx.strokeStyle = "rgba(255,255,255,0.1)"; ctx.lineWidth = 15; ctx.stroke();
  ctx.beginPath(); ctx.arc(90,90,70,-Math.PI/2, (-Math.PI/2) + (2*Math.PI*pct/100));
  ctx.strokeStyle = "#a855f7"; ctx.lineWidth = 15; ctx.lineCap = "round"; ctx.stroke();
}

function restartQuiz() {
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-main').classList.remove('hidden');
}
</script>
